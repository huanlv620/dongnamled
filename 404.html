<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang | Đèn LED đánh cá Đông Nam</title>
    <meta name="description" content="Trang bạn tìm kiếm không tồn tại. Quay lại trang chủ Đèn LED đánh cá Đông Nam để xem các sản phẩm chất lượng cao.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="stylesheet" href="/assets/fonts/stylesheet.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a2540 0%, #0a3d91 100%);
            color: #fff;
            text-align: center;
            padding: 2rem;
        }
        .error-content h1 {
            font-family: 'Inter', sans-serif;
            font-size: clamp(6rem, 15vw, 12rem);
            line-height: 1;
            margin: 0;
            color: #f4a72c;
        }
        .error-content h2 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin: 1rem 0;
            font-weight: 600;
        }
        .error-content p {
            font-size: 1.1rem;
            max-width: 500px;
            margin: 1.5rem auto;
            opacity: 0.85;
        }
        .error-btn {
            display: inline-block;
            background: #f4a72c;
            color: #0a2540;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 1rem;
            transition: transform 0.3s;
        }
        .error-btn:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <h1>404</h1>
            <h2>Không tìm thấy trang</h2>
            <p>Rất tiếc, trang bạn đang tìm kiếm không tồn tại hoặc đã được di chuyển. Vui lòng quay lại trang chủ để xem các sản phẩm Đèn LED đánh cá Đông Nam.</p>
            <a href="/" class="error-btn">← Về trang chủ</a>
        </div>
    </div>
</body>
</html>
